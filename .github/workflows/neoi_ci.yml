# NeoAI - GitHub Actions 配置

name: NeoAI CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: 设置 Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: 安装依赖
      run: |
        cd neoi
        python -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt
    
    - name: 运行测试
      run: |
        cd neoi
        source venv/bin/activate
        python -m pytest tests/ -v
    
    - name: 构建 Docker 镜像
      run: |
        cd neoi
        docker build -t neoi/neoi:test .

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: 部署到 GitHub Pages
      run: |
        echo "部署文档..."
