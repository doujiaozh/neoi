name: NeoAI CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v3

    - name: 设置 Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: 安装依赖
      run: |
        cd neoi
        python -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: 运行单元测试
      run: |
        cd neoi
        source venv/bin/activate
        python -m pytest tests/ -v --cov=core --cov-report=html

    - name: 上传覆盖率报告
      uses: codecov/codecov-action@v3
      with:
        files: ./neoi/htmlcov/coverage.xml
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: 设置 Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: 安装依赖
      run: |
        cd neoi
        pip install flake8 pylint black

    - name: 代码风格检查
      run: |
        cd neoi
        flake8 . --max-line-length=100 --ignore=E501,W503
        pylint core/ --disable=C0111,W0611

    - name: 代码格式化检查
      run: |
        cd neoi
        black --check .

  build-docker:
    needs: [test, lint]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: 登录 DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 构建和推送 Docker 镜像
      uses: docker/build-push-action@v4
      with:
        context: .
        file: neoi/Dockerfile
        push: true
        tags: |
          neoi/neoi:latest
          neoi/neoi:${{ github.sha }}

  deploy:
    needs: [test, lint, build-docker]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3

    - name: 部署文档
      run: |
        echo "部署到 GitHub Pages..."
        # 添加部署逻辑
