name: Release

on:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: 登录 DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: 构建和推送镜像
      uses: docker/build-push-action@v4
      with:
        context: .
        file: neoi/Dockerfile
        push: true
        tags: |
          neoi/neoi:${{ github.event.release.tag_name }}
          neoi/neoi:latest
