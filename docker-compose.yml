version: '3.8'

services:
  neoi_core:
    build: .
    container_name: neoi_core
    ports:
      - "8765:8765"  # P2P网络
      - "8000:8000"  # API接口
      - "8080:8080"  # Web界面
    environment:
      - PYTHONUNBUFFERED=1
      - NEUI_MODE=production
    volumes:
      - ./neoi:/app
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - neoi_network

  neoi_worker:
    build: .
    container_name: neoi_worker
    ports:
      - "8766:8765"
    environment:
      - NODE_TYPE=worker
      - CONTACT_NODE=neoi_core:8765
    volumes:
      - ./worker_data:/app/data
    restart: unless-stopped
    networks:
      - neoi_network

networks:
  neoi_network:
    driver: bridge
